<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>{% block title %}ENCCS - Lesson Library{% endblock title %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style>
            /* Lesson page text: the CDN Tailwind has no typography plugin, so "prose" needs these */
            .prose p { margin: 0 0 1rem; line-height: 1.7; }
            .prose h2 { font-size: 1.5rem; font-weight: 700; color: #2A2B31; margin: 2rem 0 1rem; }
            .prose h2:first-child { margin-top: 0; }
            .prose h3 { font-size: 1.25rem; font-weight: 600; color: #2A2B31; margin: 1.5rem 0 0.75rem; }
            .prose a { color: #2A2B31; font-weight: 500; text-decoration: underline; text-decoration-color: #FFC107; text-decoration-thickness: 2px; text-underline-offset: 3px; }
            .prose a:hover { color: #E0A800; }
            .prose ul { list-style: disc; padding-left: 1.5rem; margin: 0 0 1rem; }
            .prose ol { list-style: decimal; padding-left: 1.5rem; margin: 0 0 1rem; }
            .prose li { margin: 0.25rem 0; }
            .prose code { background: #EEEEEE; padding: 0.1rem 0.3rem; border-radius: 4px; font-size: 0.9em; }
        </style>

    </head>
    <body class="bg-[#F8F8F8] text-[#2A2B31] font-sans antialiased min-h-screen flex flex-col">
        {% include "header.html" %}

        <!-- Main Content -->
        <main class="flex-1 container mx-auto px-4 py-8">
            <section>{% block content %} {% endblock content %}</section>
        </main>

        {% include "footer.html" %}

    </body>
</html>
